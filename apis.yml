aid: vita-therapeutics
name: Vita Therapeutics
description: >-
  Vita Therapeutics is a Baltimore, Maryland cell engineering company, spun out of Johns
  Hopkins University in 2019 and formally founded in 2020, that develops induced pluripotent
  stem cell (iPSC) derived cellular therapies for neuromuscular disease and solid tumors. Its
  programs pair an autologous approach with an allogeneic, universal hypoimmunogenic approach,
  and include VTA-100 and VTA-110 for limb-girdle muscular dystrophy and related muscular
  dystrophies such as FSHD. The company raised a $31M Series B led by Cambrian BioPharma and
  Solve FSHD and operates from the University of Maryland BioPark. It is a clinical-stage
  biotechnology company: it sells no software, runs no developer program, and publishes no
  public API, SDK, webhook or machine-readable contract of any kind.
